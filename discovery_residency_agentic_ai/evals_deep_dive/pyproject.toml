[project]
name = "evals-deep-dive"
version = "0.1.0"
description = "Hands-on workshop for evaluating AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aisuite>=0.1.13",
    "dotenv>=0.9.9",
    "openai>=1.0.0",
    "duckdb>=1.4.2",
    "jupyterlab>=4.5.0",
    "jupyterlab-rise>=0.43.1",
    "pandas>=2.3.3",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "tavily>=1.1.0",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
docstring-code-format = true
